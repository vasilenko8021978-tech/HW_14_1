[tool.poetry]
name = "pythonproject3"
version = "0.1.0"
description = ""
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
black = "^26.3.1"
isort = "^8.0.1"
mypy = "^1.20.2"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 120

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == \"__main__\":"
]